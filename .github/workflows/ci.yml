name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Same install as the release workflow, so CI catches a dependency that starts needing scripts.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
