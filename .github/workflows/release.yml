name: Release

# Run from the Actions tab ("Run workflow"). Each run publishes the next version after the
# highest existing release tag: 0.01, 0.02 … 0.99, then 1.00, 1.01 … with no "v" prefix.
# The release carries standing-desk-card.js, which is the file HACS downloads.
on:
  workflow_dispatch:

permissions:
  contents: write

# Two runs at once would pick the same number.
concurrency:
  group: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # all tags, to find the latest release number
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Pick the next version
        id: version
        run: echo "version=$(node scripts/next-version.ts $(git tag --list))" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          CARD_VERSION: ${{ steps.version.outputs.version }}
      - name: Publish the release
        run: gh release create "$VERSION" dist/standing-desk-card.js --title "$VERSION" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
