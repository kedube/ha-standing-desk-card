name: Release

# Publishing a GitHub release builds the card and attaches standing-desk-card.js,
# which is the file HACS downloads.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Attach the card to the release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/standing-desk-card.js --clobber
        env:
          GH_TOKEN: ${{ github.token }}
